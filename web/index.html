<!DOCTYPE html>
<html lang="ko">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <!-- Base href with dynamic handling for itch.io -->
    <script>
      // Set base href dynamically based on hosting environment
      var baseHref = "/";
      if (
        window.location.hostname.includes("itch.zone") ||
        window.location.hostname.includes("itch.io") ||
        window.location.protocol === "file:"
      ) {
        baseHref = "./";
      }
      document.write('<base href="' + baseHref + '" />');
    </script>

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Avoid Bubble Game Cross Platform" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="avoid_bubble" />
    <link rel="apple-touch-icon" href="./icons/Icon-192.png" />

    <!-- Screen orientation for mobile -->
    <meta name="screen-orientation" content="landscape" />
    <meta name="orientation" content="landscape" />
    <meta name="mobile-web-app-orientation" content="landscape" />
    <meta name="apple-mobile-web-app-orientation" content="landscape" />
    <meta name="theme-color" content="#0175C2" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.png" />

    <!-- Itch.io compatibility -->
    <meta name="referrer" content="no-referrer" />

    <title>어보이드 버블 - Avoid Bubble</title>
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body>
    <!-- Loading screen for better UX -->
    <div
      id="loading"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1a1a1a;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        z-index: 9999;
      "
    >
      <div style="text-align: center">
        <div style="font-size: 24px; margin-bottom: 20px">🔥 어보이드 버블</div>
        <div style="font-size: 16px; opacity: 0.7">게임을 로딩중입니다...</div>
        <div style="margin-top: 20px">
          <div
            style="
              width: 200px;
              height: 4px;
              background: #333;
              border-radius: 2px;
              overflow: hidden;
            "
          >
            <div
              id="progress-bar"
              style="
                width: 0%;
                height: 100%;
                background: linear-gradient(90deg, #ff6b6b, #ffa500);
                border-radius: 2px;
                transition: width 0.3s ease;
              "
            ></div>
          </div>
        </div>
      </div>
    </div>

    <style>
      /* 로딩 화면 스타일 */
      #loading {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      /* 마우스 트래킹 문제 해결을 위한 CSS */
      flt-glass-pane {
        pointer-events: none !important;
      }

      /* Flutter 렌더링 최적화 */
      flutter-view {
        touch-action: none;
      }
    </style>

    <script>
      // 로딩 진행 상태 관리
      let loadingProgress = 0;
      let loadingSteps = [
        { progress: 20, message: "엔진 로딩중..." },
        { progress: 40, message: "게임 리소스 준비중..." },
        { progress: 60, message: "환경 설정 초기화중..." },
        { progress: 80, message: "데이터베이스 연결중..." },
        { progress: 95, message: "게임 시작 준비중..." },
        { progress: 100, message: "완료!" },
      ];
      let currentStep = 0;

      // 로딩 바 업데이트 함수
      function updateProgress(progress, message) {
        const progressBar = document.getElementById("progress-bar");
        const loadingText = document.querySelector("#loading div:nth-child(2)");

        if (progressBar) {
          progressBar.style.width = progress + "%";
        }
        if (loadingText && message) {
          loadingText.textContent = message;
        }
      }

      // 점진적 로딩 시뮬레이션
      function simulateLoading() {
        if (currentStep < loadingSteps.length) {
          const step = loadingSteps[currentStep];
          updateProgress(step.progress, step.message);
          currentStep++;

          // Flutter가 로드되기 전까지는 천천히 진행
          const delay = currentStep < 3 ? 800 : 1500;
          setTimeout(simulateLoading, delay);
        }
      }

      // 로딩 시작
      setTimeout(simulateLoading, 500);

      // Flutter 첫 프레임이 렌더링되면 로딩 화면 제거 준비
      let flutterReady = false;
      let gameReady = false;

      window.addEventListener("flutter-first-frame", function () {
        flutterReady = true;
        updateProgress(90, "게임 로딩 중...");
        checkGameReady();
      });

      // 게임이 실제로 준비되었을 때의 이벤트
      window.addEventListener("gameReady", function () {
        gameReady = true;
        checkGameReady();
      });

      // Flutter와 게임이 모두 준비되었을 때 로딩 제거
      function checkGameReady() {
        if (flutterReady || gameReady) {
          updateProgress(100, "게임 시작!");

          setTimeout(function () {
            const loading = document.querySelector("#loading");
            if (loading) {
              loading.style.opacity = "0";
              loading.style.transition = "opacity 0.5s ease-out";
              setTimeout(function () {
                loading.remove();
              }, 500);
            }
          }, 300);
        }
      }

      // Flutter에서 호출
      window.gameLoadingComplete = function () {
        console.log("🚀 Flutter 게임 로딩 완료");
        gameReady = true;
        checkGameReady();
      };

      // itch.io 환경 디버깅을 위한 추가 정보
      if (window.parent !== window) {
        console.log("🔍 itch.io 환경 정보:");
        console.log("   - User Agent:", navigator.userAgent);
        console.log("   - Platform:", navigator.platform);
        console.log("   - Language:", navigator.language);
        console.log("   - Online:", navigator.onLine);
        
        // itch.io에서 필요한 권한 체크
        setTimeout(function() {
          console.log("⏰ 10초 후 게임 상태 체크...");
          setTimeout(function() {
            if (!flutterReady && !gameReady) {
              console.error("❌ 게임 로딩 실패 - Flutter 초기화되지 않음");
              console.log("💡 해결책: 브라우저 캐시 삭제 후 새로고침");
            } else if (flutterReady && !gameReady) {
              console.log("⚠️ Flutter는 로딩되었으나 게임 준비 안됨");
            } else {
              console.log("✅ 게임 정상 로딩 완료");
            }
          }, 10000);
        }, 1000);
      }

      // 모바일 디바이스 감지 함수
      window.isMobileDevice = function () {
        const userAgent = navigator.userAgent;
        const isMobile =
          /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|tablet/i.test(
            userAgent
          );
        const isTouchDevice =
          "ontouchstart" in window || navigator.maxTouchPoints > 0;

        return isMobile || isTouchDevice;
      };

      // Flutter가 로드되면 모바일 여부를 전역 변수로 설정
      window.IS_MOBILE_DEVICE = window.isMobileDevice();

      // 마우스 트래킹 오류 방지를 위한 전역 설정 (itch.io 호환성 개선)
      window.addEventListener("error", function (e) {
        // itch.io iframe에서 발생하는 일반적인 오류들 무시
        if (e.message && (
          e.message.includes("mouse_tracker") ||
          e.message.includes("deviceUpdatePhase") ||
          e.message.includes("_debugDuringDeviceUpdate") ||
          e.message.includes("updateAllDevices") ||
          e.message.includes("RenderObject") ||
          e.message.includes("orientation") ||
          e.message.includes("NotSupportedError") ||
          e.message.includes("SecurityError") ||
          e.message.includes("DOMException")
        )) {
          e.preventDefault();
          return false;
        }
      });

      // unhandledrejection 이벤트도 처리 (itch.io 호환성 개선)
      window.addEventListener("unhandledrejection", function (e) {
        if (e.reason && e.reason.toString) {
          const reasonStr = e.reason.toString().toLowerCase();
          // itch.io iframe에서 발생하는 일반적인 Promise rejection 무시
          if (reasonStr.includes("mouse_tracker") ||
              reasonStr.includes("deviceupdatephase") ||
              reasonStr.includes("debugduringdeviceupdate") ||
              reasonStr.includes("orientation") ||
              reasonStr.includes("notsupported") ||
              reasonStr.includes("securityerror") ||
              reasonStr.includes("domexception") ||
              reasonStr.includes("network")) {
            e.preventDefault();
            return false;
          }
        }
      });

      // iframe 환경에서의 마우스 이벤트 처리 개선
      if (window.parent !== window) {
        // iframe 내부에서 실행 중 (itch.io 등)
        console.log("🎮 itch.io iframe 환경에서 실행 중");
        console.log("📱 Mobile Device:", window.IS_MOBILE_DEVICE);
        console.log("🖥️ Screen Size:", window.innerWidth + "x" + window.innerHeight);
        
        // itch.io iframe에서 안전한 설정
        try {
          document.addEventListener("mouseleave", function () {
            // 마우스가 iframe을 벗어날 때 안전하게 처리
          });

          document.addEventListener("mouseenter", function () {
            // 마우스가 iframe으로 들어올 때 안전하게 처리
          });

          // iframe 환경에서 포커스 관리
          document.addEventListener("click", function () {
            try {
              window.focus();
            } catch (e) {
              // 포커스 오류 무시
            }
          });

          // iframe 크기 변경 감지
          window.addEventListener("resize", function () {
            try {
              // Flutter에게 크기 변경 알림
              if (window.dispatchEvent) {
                window.dispatchEvent(new Event('resize'));
              }
            } catch (e) {
              // 리사이즈 이벤트 오류 무시
            }
          });
        } catch (e) {
          console.log("iframe 이벤트 설정 오류 (정상적인 동작)");
        }
      }

      // body 태그에 모바일 클래스 추가 (Flutter에서 CSS로 감지 가능)
      if (window.IS_MOBILE_DEVICE) {
        document.body.classList.add("mobile-device");

        // 모바일에서 landscape 강제 설정 (itch.io 호환성 개선)
        try {
          // itch.io iframe 환경에서는 orientation lock이 제한됨
          if (window.parent !== window) {
            // iframe 환경 (itch.io 등)에서는 orientation lock을 시도하지 않음
            console.log("iframe 환경에서는 화면 회전 잠금을 지원하지 않습니다");
          } else if (screen.orientation && screen.orientation.lock && typeof screen.orientation.lock === 'function') {
            // 일반 브라우저 환경에서만 시도
            screen.orientation.lock("landscape").catch(function (err) {
              console.log("화면 회전 잠금 실패 (정상적인 동작):", err.message);
            });
          }
        } catch (e) {
          console.log("화면 회전 API 사용 불가 (정상적인 동작)");
        }

        // 화면 회전 감지 및 알림 (itch.io 호환성 개선)
        window.addEventListener("orientationchange", function () {
          setTimeout(function () {
            try {
              const orientation = screen.orientation
                ? screen.orientation.angle
                : (typeof window.orientation !== 'undefined' ? window.orientation : 0);

              // 세로 방향일 때만 알림 표시 (iframe이 아닌 경우만)
              if (window.parent === window && Math.abs(orientation) !== 90) {
                showOrientationMessage();
              } else {
                hideOrientationMessage();
              }
            } catch (e) {
              // 오류 발생 시 조용히 무시
              console.log("화면 회전 감지 오류 (정상적인 동작)");
            }
          }, 100);
        });

        // 초기 방향 체크 (iframe이 아닌 경우만)
        if (window.parent === window) {
          setTimeout(function () {
            try {
              const orientation = screen.orientation
                ? screen.orientation.angle
                : (typeof window.orientation !== 'undefined' ? window.orientation : 0);
              if (Math.abs(orientation) !== 90) {
                showOrientationMessage();
              }
            } catch (e) {
              console.log("초기 화면 회전 체크 오류 (정상적인 동작)");
            }
          }, 1000);
        }
      } else {
        document.body.classList.add("desktop-device");
      }

      // 방향 알림 메시지 표시
      function showOrientationMessage() {
        let orientationMsg = document.getElementById("orientation-message");
        if (!orientationMsg) {
          orientationMsg = document.createElement("div");
          orientationMsg.id = "orientation-message";
          orientationMsg.innerHTML = `
            <div style="text-align: center; color: white; font-family: Arial, sans-serif;">
              <div style="font-size: 48px; margin-bottom: 16px;">📱</div>
              <div style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">화면을 회전해주세요</div>
              <div style="font-size: 16px; opacity: 0.8;">더 나은 게임 경험을 위해 가로 모드로 플레이해주세요</div>
            </div>
          `;
          orientationMsg.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(10px);
          `;
          document.body.appendChild(orientationMsg);
        }
        orientationMsg.style.display = "flex";
      }

      // 방향 알림 메시지 숨김
      function hideOrientationMessage() {
        const orientationMsg = document.getElementById("orientation-message");
        if (orientationMsg) {
          orientationMsg.style.display = "none";
        }
      }
    </script>

    <script src="./flutter_bootstrap.js" async></script>
  </body>
</html>
